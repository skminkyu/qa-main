<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SK스토아 품질관리팀 통합 도구 허브</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--surface:#ffffff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;
  --accent:#2563eb;--accent-light:#eff6ff;--radius:12px;--shadow:0 1px 4px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);--nav-w:220px;--header-h:56px;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.shell{display:flex;flex:1;height:100vh;overflow:hidden}
.sidebar{width:var(--nav-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}
.logo-area{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.logo-area h1{font-size:13px;font-weight:700;color:var(--accent);line-height:1.4}
.logo-area p{font-size:11px;color:var(--text2);margin-top:2px}
.nav-section{padding:8px 8px 0}
.nav-label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px 4px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:.15s;position:relative;margin-bottom:1px}
.ni:hover{background:#f1f5f9;color:var(--text)}
.ni.active{background:var(--accent-light);color:var(--accent)}
.ni svg{width:15px;height:15px;flex-shrink:0}
.ni .badge{margin-left:auto;background:#e2e8f0;color:var(--text2);font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
.ni.active .badge{background:var(--accent);color:#fff}
.sched-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.profile-area{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.profile-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text)}
.profile-btn:hover{background:#f8fafc}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.view{display:none}.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.greeting-banner{background:linear-gradient(135deg,#1d4ed8,#2563eb,#3b82f6);color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:24px;position:relative;overflow:hidden}
.greeting-banner::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.greeting-banner h2{font-size:18px;font-weight:700;margin-bottom:4px}
.greeting-banner p{font-size:13px;opacity:.85}
.gstats{display:flex;gap:12px;margin-top:16px}
.gstat{background:rgba(255,255,255,.15);border-radius:8px;padding:10px 14px;flex:1;cursor:default}
.gstat-num{font-size:22px;font-weight:700;line-height:1}
.gstat-lbl{font-size:11px;opacity:.8;margin-top:3px}
.gstat.clickable{cursor:pointer;transition:.15s}
.gstat.clickable:hover{background:rgba(255,255,255,.25)}
.section-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tool-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px}
.tool-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.tc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.tc-title{font-size:13px;font-weight:600;line-height:1.3}
.tc-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;align-self:flex-start}
.i-blue{background:#eff6ff;color:#2563eb}.a-blue{background:#eff6ff;color:#2563eb}.sc.b-blue:hover{border-color:#2563eb;background:#eff6ff}
.i-amber{background:#fffbeb;color:#d97706}.a-amber{background:#fffbeb;color:#d97706}.sc.b-amber:hover{border-color:#d97706;background:#fffbeb}
.i-green{background:#f0fdf4;color:#16a34a}.a-green{background:#f0fdf4;color:#16a34a}.sc.b-green:hover{border-color:#16a34a;background:#f0fdf4}
.i-cyan{background:#ecfeff;color:#0891b2}.a-cyan{background:#ecfeff;color:#0891b2}.sc.b-cyan:hover{border-color:#0891b2;background:#ecfeff}
.i-slate{background:#f8fafc;color:#475569}.a-slate{background:#f8fafc;color:#475569}.sc.b-slate:hover{border-color:#475569;background:#f8fafc}
.i-teal{background:#f0fdfa;color:#0d9488}.a-teal{background:#f0fdfa;color:#0d9488}.sc.b-teal:hover{border-color:#0d9488;background:#f0fdfa}
.i-red{background:#fef2f2;color:#dc2626}.a-red{background:#fef2f2;color:#dc2626}.sc.b-red:hover{border-color:#dc2626;background:#fef2f2}
.i-violet{background:#f5f3ff;color:#7c3aed}.a-violet{background:#f5f3ff;color:#7c3aed}.sc.b-violet:hover{border-color:#7c3aed;background:#f5f3ff}
.i-pink{background:#fdf2f8;color:#be185d}.a-pink{background:#fdf2f8;color:#be185d}.sc.b-pink:hover{border-color:#be185d;background:#fdf2f8}
.i-indigo{background:#eef2ff;color:#4338ca}.a-indigo{background:#eef2ff;color:#4338ca}.sc.b-indigo:hover{border-color:#4338ca;background:#eef2ff}
.i-sky{background:#f0f9ff;color:#0369a1}.a-sky{background:#f0f9ff;color:#0369a1}.sc.b-sky:hover{border-color:#0369a1;background:#f0f9ff}
.i-orange{background:#fff7ed;color:#ea580c}.a-orange{background:#fff7ed;color:#ea580c}.sc.b-orange:hover{border-color:#ea580c;background:#fff7ed}
.i-lime{background:#f7fee7;color:#65a30d}.a-lime{background:#f7fee7;color:#65a30d}.sc.b-lime:hover{border-color:#65a30d;background:#f7fee7}
.i-emerald{background:#ecfdf5;color:#059669}.a-emerald{background:#ecfdf5;color:#059669}.sc.b-emerald:hover{border-color:#059669;background:#ecfdf5}
.i-rose{background:#fff1f2;color:#e11d48}.a-rose{background:#fff1f2;color:#e11d48}.sc.b-rose:hover{border-color:#e11d48;background:#fff1f2}
.i-purple{background:#faf5ff;color:#7e22ce}.a-purple{background:#faf5ff;color:#7e22ce}.sc.b-purple:hover{border-color:#7e22ce;background:#faf5ff}
.tg-blue{background:#eff6ff;color:#2563eb}.tg-amber{background:#fffbeb;color:#d97706}.tg-green{background:#f0fdf4;color:#16a34a}.tg-cyan{background:#ecfeff;color:#0891b2}.tg-slate{background:#f8fafc;color:#475569}.tg-teal{background:#f0fdfa;color:#0d9488}.tg-red{background:#fef2f2;color:#dc2626}.tg-violet{background:#f5f3ff;color:#7c3aed}.tg-pink{background:#fdf2f8;color:#be185d}.tg-indigo{background:#eef2ff;color:#4338ca}.tg-sky{background:#f0f9ff;color:#0369a1}.tg-orange{background:#fff7ed;color:#ea580c}.tg-lime{background:#f7fee7;color:#65a30d}.tg-emerald{background:#ecfdf5;color:#059669}.tg-rose{background:#fff1f2;color:#e11d48}.tg-purple{background:#faf5ff;color:#7e22ce}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.15s}
.rec-item:hover{box-shadow:var(--shadow-md)}
.rec-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-time{font-size:11px;color:var(--text2);margin-top:2px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.sc:hover{box-shadow:var(--shadow-md)}
.sc-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sc-info{flex:1;min-width:0}
.sc-title{font-size:13px;font-weight:600}
.sc-tag{font-size:10px;color:var(--text2);margin-top:2px}
.all-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--text);transition:.15s}
.cal-nav-btn:hover{background:#f1f5f9}
.cal-month{font-size:16px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text2);padding:6px 0}
.cal-day{min-height:72px;padding:6px;border-radius:7px;cursor:pointer;position:relative;transition:.1s;border:1px solid transparent}
.cal-day:hover{background:#f1f5f9}
.cal-day.other-month .dn{color:#cbd5e1}
.cal-day.today .dn{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-day.selected{border-color:var(--accent);background:var(--accent-light)}
.dn{font-size:12px;font-weight:500;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.dot{width:5px;height:5px;border-radius:50%}
.sched-panel{margin-top:20px}
.sched-panel-title{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)}
.sched-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.sched-item .dot-l{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.sched-info{flex:1;min-width:0}
.sched-title-txt{font-size:13px;font-weight:600}
.sched-meta{font-size:11px;color:var(--text2);margin-top:2px}
.sched-item.completed .sched-title-txt{text-decoration:line-through;color:var(--text2)}
.check-btn{background:none;border:1px solid var(--border);border-radius:5px;width:20px;height:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:.15s}
.check-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.check-btn.done{background:#16a34a;border-color:#16a34a;color:#fff}
.del-btn{background:none;border:none;cursor:pointer;color:#94a3b8;font-size:14px;padding:2px 4px;border-radius:4px;transition:.1s}
.del-btn:hover{color:#ef4444;background:#fef2f2}
.add-sched-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.add-sched-btn:hover{background:#1d4ed8}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:420px;max-width:95vw;box-shadow:var(--shadow-md)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:.15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group textarea{resize:vertical;min-height:70px}
.color-picker{display:flex;flex-wrap:wrap;gap:6px}
.cp-opt{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.1s}
.cp-opt.sel{border-color:#1e293b;transform:scale(1.15)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-ghost{background:#f1f5f9;color:var(--text)}.btn-ghost:hover{background:#e2e8f0}
.team-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tcal-day{min-height:80px;padding:5px;border-radius:7px;border:1px solid transparent;cursor:pointer;transition:.1s}
.tcal-day:hover{background:#f1f5f9}
.tcal-day.today-t{border-color:var(--accent);background:var(--accent-light)}
.team-sched-pill{font-size:10px;font-weight:600;border-radius:4px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.gtab{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:.15s;color:var(--text2)}
.gtab:hover{border-color:var(--accent);color:var(--accent)}
.gtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.guide-content{display:none}.guide-content.active{display:block}
.guide-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.guide-card h4{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.step-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.step-item{display:flex;align-items:flex-start;gap:10px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:13px;line-height:1.5;padding-top:2px}
.tips-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:12px;margin-top:12px}
.tips-box p{font-size:12px;color:#92400e;line-height:1.6}
.guide-img-area{margin-top:16px}
.guide-img-placeholder{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;color:var(--text2);font-size:13px}
.guide-img-upload{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.upload-btn{padding:6px 12px;background:#f1f5f9;border:1px solid var(--border);border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.upload-btn:hover{background:#e2e8f0}
.guide-imgs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.guide-img-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.guide-img-thumb img{width:100%;display:block;cursor:pointer}
.guide-img-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.iframe-shell{position:fixed;inset:0;z-index:200;background:var(--surface);display:none;flex-direction:column}
.iframe-shell.open{display:flex}
.iframe-bar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.iframe-title{font-size:14px;font-weight:600;flex:1}
.iframe-close{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 14px;cursor:pointer;font-size:13px;color:var(--text)}
.iframe-close:hover{background:#f1f5f9}
.iframe-shell iframe{flex:1;border:none}
.profile-modal{background:var(--surface);border-radius:var(--radius);padding:28px;width:360px;max-width:95vw;box-shadow:var(--shadow-md);text-align:center}
.profile-modal .big-avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 16px}
.flex{display:flex}.items-center{align-items:center}.gap-8{gap:8px}.mt-16{margin-top:16px}
.empty-state{text-align:center;padding:40px;color:var(--text2);font-size:13px}
.topbar-title{font-size:15px;font-weight:700;flex:1}
.today-hint{font-size:11px;background:rgba(255,255,255,.2);border-radius:4px;padding:1px 6px;cursor:help}
#today-tooltip{display:none;position:fixed;background:#1e293b;color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;z-index:9999;min-width:180px;max-width:240px;pointer-events:none;box-shadow:var(--shadow-md)}
#today-tooltip .tt-item{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
#today-tooltip .tt-item:last-child{border-bottom:none}
.repeat-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.repeat-row select{width:auto;flex:1;min-width:100px}
.repeat-row input[type=date]{flex:1;min-width:100px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@media(max-width:640px){.sidebar{display:none}.tools-grid{grid-template-columns:repeat(2,1fr)}.all-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login-overlay" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#1d4ed8,#3b82f6);z-index:500;align-items:center;justify-content:center;flex-direction:column">
  <div style="background:#fff;border-radius:16px;padding:36px;width:340px;max-width:95vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div style="width:60px;height:60px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
      <svg width="28" height="28" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <h2 style="font-size:18px;font-weight:700;color:#1e293b;margin-bottom:4px">SK스토아 품질관리팀</h2>
    <p style="font-size:13px;color:#64748b;margin-bottom:24px">통합 도구 허브</p>
    <div style="text-align:left;margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:5px">이름</label>
      <input id="login-name" type="text" placeholder="이름을 입력하세요" style="width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;font-family:inherit" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button onclick="doLogin()" style="width:100%;padding:11px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">입장하기</button>
  </div>
</div>
<div class="shell">
  <nav class="sidebar">
    <div class="logo-area">
      <h1>SK스토아 품질관리팀</h1>
      <p>통합 도구 허브</p>
    </div>
    <div class="nav-section">
      <div class="nav-label">메인</div>
      <div class="ni active" data-v="home" onclick="switchView('home')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        홈
      </div>
      <div class="ni" data-v="recent" onclick="switchView('recent')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>

let schedules=JSON.parse(localStorage.getItem('qa-schedules')||'[]');
let userProfile=JSON.parse(localStorage.getItem('qa-user-profile')||'null');
let recentTools=JSON.parse(localStorage.getItem('qa-recent')||'[]');
let calYear,calMonth,selectedDate=null;
let teamYear,teamMonth,teamSelectedDate=null;
let selectedColor='blue';
let currentGuideIdx=0;
function init(){
  const now=new Date();
  calYear=now.getFullYear();calMonth=now.getMonth();
  teamYear=now.getFullYear();teamMonth=now.getMonth();
  document.getElementById('topbar-date').textContent=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  if(!userProfile||!userProfile.name){showLogin();}else{startApp();}
}
function showLogin(){document.getElementById('login-overlay').style.display='flex';}
function doLogin(){
  const name=document.getElementById('login-name').value.trim();
  if(!name){alert('이름을 입력해주세요.');return;}
  userProfile={name};
  localStorage.setItem('qa-user-profile',JSON.stringify(userProfile));
  document.getElementById('login-overlay').style.display='none';
  startApp();
}
function startApp(){updateProfileUI();renderHome();renderCalendar();renderTeamCalendar();updateSchedBadge();renderGuide();}
function updateProfileUI(){
  if(!userProfile)return;
  const n=userProfile.name;
  document.getElementById('nav-avatar').textContent=n.charAt(0);
  document.getElementById('nav-name').textContent=n;
  document.getElementById('greeting-text').textContent=`안녕하세요, ${n}님! 👋`;
  document.getElementById('greeting-sub').textContent='오늘도 SK스토아 품질관리팀 업무를 시작해볼까요?';
}
function localDateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function mySchedules(){if(!userProfile||!userProfile.name)return[];return schedules.filter(s=>s.author&&s.author.name===userProfile.name);}
function renderHome(){
  const grid=document.getElementById('home-tools-grid');
  grid.innerHTML=TOOLS.map((t,i)=>`<div class="tool-card" onclick="openTool(${i})"><div class="tc-icon i-${t.color}">${SVGS[t.color]||''}</div><div class="tc-title">${t.title}</div><div class="tc-tag tg-${t.color}">${t.tag}</div></div>`).join('');
  const today=localDateStr(new Date());
  const cnt=mySchedules().filter(s=>s.date===today).length;
  document.getElementById('gstat-num').textContent=cnt;
}
function showTodayTooltip(e){
  const today=localDateStr(new Date());
  const items=mySchedules().filter(s=>s.date===today);
  const tt=document.getElementById('today-tooltip');
  if(items.length===0){tt.innerHTML='<div style="color:#94a3b8;font-size:11px">오늘 일정이 없습니다</div>';}else{tt.innerHTML=items.map(s=>`<div class="tt-item"><span style="color:${COLOR_HEX[s.color]||'#fff'}">●</span> ${s.title}${s.time?' '+s.time:''}</div>`).join('');}
  const rect=e.currentTarget.getBoundingClientRect();
  tt.style.display='block';
  const tw=tt.offsetWidth;
  let left=rect.left;
  if(left+tw>window.innerWidth-10)left=window.innerWidth-tw-10;
  tt.style.left=left+'px';
  tt.style.top=(rect.bottom+8)+'px';
}
function hideTodayTooltip(){document.getElementById('today-tooltip').style.display='none';}
function renderRecent(){
  const list=document.getElementById('rec-list');
  if(recentTools.length===0){list.innerHTML='<div class="empty-state">최근 사용한 도구가 없습니다.</div>';return;}
  list.innerHTML=recentTools.slice(0,10).map(r=>{const t=TOOLS[r.idx];if(!t)return'';return`<div class="rec-item" onclick="openTool(${r.idx})"><div class="rec-icon i-${t.color}">${SVGS[t.color]||''}</div><div class="rec-info"><div class="rec-title">${t.title}</div><div class="rec-time">${r.time}</div></div></div>`;}).join('');
}
function renderAll(){
  const q=(document.getElementById('tool-search')||{}).value||'';
  const grid=document.getElementById('all-grid');
  const filtered=TOOLS.map((t,i)=>({t,i})).filter(({t})=>!q||t.title.includes(q)||t.tag.includes(q));
  grid.innerHTML=filtered.map(({t,i})=>`<div class="sc b-${t.color}" onclick="openTool(${i})"><div class="sc-icon i-${t.color}">${SVGS[t.color]||''}</div><div class="sc-info"><div class="sc-title">${t.title}</div><div class="sc-tag">${t.tag}</div></div></div>`).join('');
}
function openTool(idx){
  const t=TOOLS[idx];
  if(!t)return;
  addRecent(idx);
  if(t.external){window.open(t.url,'_blank');}else{document.getElementById('iframe-title').textContent=t.title;document.getElementById('iframe-content').src=t.url;document.getElementById('iframe-shell').classList.add('open');}
}
function closeIframe(){document.getElementById('iframe-shell').classList.remove('open');document.getElementById('iframe-content').src='';}
function addRecent(idx){
  const now=new Date().toLocaleString('ko-KR');
  recentTools=recentTools.filter(r=>r.idx!==idx);
  recentTools.unshift({idx,time:now});
  if(recentTools.length>20)recentTools.length=20;
  localStorage.setItem('qa-recent',JSON.stringify(recentTools));
}
function renderCalendar(){
  document.getElementById('cal-month-label').textContent=`${calYear}년 ${calMonth+1}월`;
  const grid=document.getElementById('cal-grid');
  const dows=['일','월','화','수','목','금','토'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1);
  const last=new Date(calYear,calMonth+1,0);
  const today=localDateStr(new Date());
  const mySch=mySchedules();
  let day=new Date(first);
  day.setDate(day.getDate()-day.getDay());
  for(let w=0;w<6;w++){
    for(let d=0;d<7;d++){
      const ds=localDateStr(day);
      const isOther=day.getMonth()!==calMonth;
      const isToday=ds===today;
      const isSel=ds===selectedDate;
      const dayScheds=mySch.filter(s=>s.date===ds);
      const cls=['cal-day',isOther?'other-month':'',isToday?'today':'',isSel?'selected':''].filter(Boolean).join(' ');
      const dots=dayScheds.map(s=>`<div class="dot" style="background:${COLOR_HEX[s.color]||'#2563eb'}"></div>`).join('');
      html+=`<div class="${cls}" onclick="selectDate('${ds}')"><div class="dn">${day.getDate()}</div><div class="cal-dots">${dots}</div></div>`;
      day.setDate(day.getDate()+1);
    }
    if(day>last&&w>=4)break;
  }
  grid.innerHTML=html;
}
function selectDate(ds){selectedDate=ds;renderCalendar();renderSchedList(ds);}
function renderSchedList(ds){
  const title=document.getElementById('sched-panel-title');
  const list=document.getElementById('sched-list');
  title.textContent=ds?`${ds} 일정`:'날짜를 선택하세요';
  if(!ds){list.innerHTML='';return;}
  const mySch=mySchedules().filter(s=>s.date===ds);
  if(mySch.length===0){list.innerHTML='<div class="empty-state" style="padding:20px">이 날 일정이 없습니다.</div>';return;}
  list.innerHTML=mySch.map(s=>`<div class="sched-item${s.completed?' completed':''}"><button class="check-btn${s.completed?' done':''}" onclick="toggleComplete('${s.id}')" title="완료 토글">${s.completed?'✓':''}</button><div class="dot-l" style="background:${COLOR_HEX[s.color]||'#2563eb'}"></div><div class="sched-info"><div class="sched-title-txt">${s.title}</div><div class="sched-meta">${s.time||''}${s.memo?' · '+s.memo:''}</div></div><button class="del-btn" onclick="deleteSchedule('${s.id}')">✕</button></div>`).join('');
}
function changeMonth(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalendar();if(selectedDate)renderSchedList(selectedDate);}
function goToday(){const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();selectedDate=localDateStr(now);renderCalendar();renderSchedList(selectedDate);}
function renderTeamCalendar(){
  document.getElementById('team-month-label').textContent=`${teamYear}년 ${teamMonth+1}월`;
  const grid=document.getElementById('team-cal-grid');
  const dows=['일','월','화','수','목','금','토'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(teamYear,teamMonth,1);
  const last=new Date(teamYear,teamMonth+1,0);
  const today=localDateStr(new Date());
  let day=new Date(first);
  day.setDate(day.getDate()-day.getDay());
  for(let w=0;w<6;w++){
    for(let d=0;d<7;d++){
      const ds=localDateStr(day);
      const isOther=day.getMonth()!==teamMonth;
      const isToday=ds===today;
      const dayScheds=schedules.filter(s=>s.date===ds);
      const cls=['tcal-day',isOther?'other-month':'',isToday?'today-t':''].filter(Boolean).join(' ');
      const pills=dayScheds.slice(0,3).map(s=>`<div class="team-sched-pill" style="background:${COLOR_HEX[s.color]||'#2563eb'}22;color:${COLOR_HEX[s.color]||'#2563eb'}">${s.author?s.author.name:'?'}: ${s.title}</div>`).join('');
      const more=dayScheds.length>3?`<div style="font-size:9px;color:var(--text2);margin-top:2px">+${dayScheds.length-3}개</div>`:'';
      html+=`<div class="${cls}" onclick="selectTeamDate('${ds}')"><div class="dn" style="${isOther?'color:#cbd5e1':''}${isToday?';background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:700':''}">${day.getDate()}</div>${pills}${more}</div>`;
      day.setDate(day.getDate()+1);
    }
    if(day>last&&w>=4)break;
  }
  grid.innerHTML=html;
}
function selectTeamDate(ds){teamSelectedDate=ds;renderTeamCalendar();renderTeamDayPanel(ds);}
function renderTeamDayPanel(ds){
  const panel=document.getElementById('team-day-panel');
  const dayScheds=schedules.filter(s=>s.date===ds);
  if(dayScheds.length===0){panel.innerHTML='<div class="empty-state">이 날 팀 일정이 없습니다.</div>';return;}
  const byAuthor={};
  dayScheds.forEach(s=>{const n=s.author?s.author.name:'미확인';if(!byAuthor[n])byAuthor[n]=[];byAuthor[n].push(s);});
  panel.innerHTML=`<div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text2)">${ds} 팀 일정</div>`+Object.entries(byAuthor).map(([name,items])=>`<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px">👤 ${name}</div>${items.map(s=>`<div class="sched-item" style="margin-bottom:4px"><div class="dot-l" style="background:${COLOR_HEX[s.color]||'#2563eb'}"></div><div class="sched-info"><div class="sched-title-txt">${s.title}</div><div class="sched-meta">${s.time||''}${s.memo?' · '+s.memo:''}</div></div></div>`).join('')}</div>`).join('');
}
function changeTeamMonth(d){teamMonth+=d;if(teamMonth<0){teamMonth=11;teamYear--;}if(teamMonth>11){teamMonth=0;teamYear++;}renderTeamCalendar();}
function goTeamToday(){const now=new Date();teamYear=now.getFullYear();teamMonth=now.getMonth();renderTeamCalendar();}
function openAddModal(){
  const today=selectedDate||localDateStr(new Date());
  document.getElementById('m-title').value='';
  document.getElementById('m-date').value=today;
  document.getElementById('m-time').value='';
  document.getElementById('m-memo').value='';
  document.getElementById('m-repeat').value='none';
  document.getElementById('m-repeat-end').value='';
  document.getElementById('repeat-end-group').style.display='none';
  selectedColor='blue';
  renderColorPicker();
  document.getElementById('add-modal').classList.add('open');
}
function closeAddModal(){document.getElementById('add-modal').classList.remove('open');}
function toggleRepeatEnd(){const val=document.getElementById('m-repeat').value;document.getElementById('repeat-end-group').style.display=val==='none'?'none':'block';}
function renderColorPicker(){
  const colors=['blue','amber','green','cyan','slate','teal','red','violet','pink','indigo','sky','orange','lime','emerald','rose','purple'];
  document.getElementById('color-picker').innerHTML=colors.map(c=>`<div class="cp-opt${c===selectedColor?' sel':''}" style="background:${COLOR_HEX[c]}" onclick="pickColor('${c}')"></div>`).join('');
}
function pickColor(c){selectedColor=c;renderColorPicker();}
function saveSchedule(){
  const title=document.getElementById('m-title').value.trim();
  const date=document.getElementById('m-date').value;
  if(!title){alert('제목을 입력하세요.');return;}
  if(!date){alert('날짜를 선택하세요.');return;}
  const repeat=document.getElementById('m-repeat').value;
  const repeatEnd=document.getElementById('m-repeat-end').value;
  const base={title,time:document.getElementById('m-time').value,memo:document.getElementById('m-memo').value,color:selectedColor,author:userProfile?{name:userProfile.name}:null,completed:false};
  if(repeat==='none'){schedules.push({...base,id:Date.now().toString(),date});}else{
    let cur=new Date(date+'T00:00:00');
    const end=repeatEnd?new Date(repeatEnd+'T00:00:00'):new Date(date+'T00:00:00');
    end.setMonth(end.getMonth()+3);
    let count=0;
    while(cur<=end&&count<100){schedules.push({...base,id:Date.now().toString()+'-'+count,date:localDateStr(cur)});if(repeat==='weekly')cur.setDate(cur.getDate()+7);else cur.setMonth(cur.getMonth()+1);count++;}
  }
  saveSchedules();closeAddModal();renderCalendar();if(selectedDate)renderSchedList(selectedDate);updateSchedBadge();renderHome();
}
function saveSchedules(){localStorage.setItem('qa-schedules',JSON.stringify(schedules));}
function deleteSchedule(id){schedules=schedules.filter(s=>s.id!==id);saveSchedules();if(selectedDate)renderSchedList(selectedDate);renderCalendar();updateSchedBadge();renderHome();}
function toggleComplete(id){const s=schedules.find(x=>x.id===id);if(!s)return;s.completed=!s.completed;saveSchedules();if(selectedDate)renderSchedList(selectedDate);renderCalendar();}
function updateSchedBadge(){
  const today=localDateStr(new Date());
  const cnt=mySchedules().filter(s=>s.date===today&&!s.completed).length;
  const badge=document.getElementById('sched-badge');
  if(cnt>0){badge.style.display='';badge.textContent=cnt;}else{badge.style.display='none';}
}
function renderGuide(){
  const tabs=document.getElementById('guide-tabs');
  const panels=document.getElementById('guide-panels');
  tabs.innerHTML=TOOLS.map((t,i)=>`<div class="gtab${i===0?' active':''}" onclick="switchGuideTab(${i})">${t.title}</div>`).join('');
  panels.innerHTML=TOOLS.map((t,i)=>{
    const g=GUIDE_DATA[i]||{steps:[],tips:''};
    const stepsHtml=Array.isArray(g.steps)?g.steps.map((s,si)=>`<li class="step-item"><div class="step-num">${si+1}</div><div class="step-text">${s}</div></li>`).join(''):'';
    const tipsHtml=g.tips?`<div class="tips-box"><p>💡 ${g.tips}</p></div>`:'';
    return`<div class="guide-content${i===0?' active':''}" id="guide-${i}"><div class="guide-card"><h4><div class="tc-icon i-${t.color}" style="width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;margin-right:4px">${SVGS[t.color]||''}</div>${t.title} 사용 방법</h4><ul class="step-list">${stepsHtml}</ul>${tipsHtml}</div><div class="guide-card"><h4>📸 사용 안내 이미지</h4><div class="guide-img-area"><div id="guide-imgs-${i}" class="guide-imgs-grid"></div><div class="guide-img-upload"><label class="upload-btn" for="guide-file-${i}">+ 이미지 추가</label><input type="file" id="guide-file-${i}" accept="image/*" multiple style="display:none" onchange="uploadGuideImg(${i},this)"><span style="font-size:11px;color:var(--text2)">PNG, JPG 등 이미지 파일 업로드 가능</span></div></div></div></div>`;
  }).join('');
  loadGuideImgs();
}
function switchGuideTab(idx){currentGuideIdx=idx;document.querySelectorAll('.gtab').forEach((el,i)=>el.classList.toggle('active',i===idx));document.querySelectorAll('.guide-content').forEach((el,i)=>el.classList.toggle('active',i===idx));}
function uploadGuideImg(idx,input){
  Array.from(input.files).forEach(f=>{const reader=new FileReader();reader.onload=e=>{const key=`qa-guide-imgs-${idx}`;const existing=JSON.parse(localStorage.getItem(key)||'[]');existing.push(e.target.result);localStorage.setItem(key,JSON.stringify(existing));renderGuideImgs(idx);};reader.readAsDataURL(f);});
  input.value='';
}
function renderGuideImgs(idx){
  const key=`qa-guide-imgs-${idx}`;
  const imgs=JSON.parse(localStorage.getItem(key)||'[]');
  const container=document.getElementById(`guide-imgs-${idx}`);
  if(!container)return;
  if(imgs.length===0){container.innerHTML='<div class="guide-img-placeholder">업로드된 이미지가 없습니다.<br>아래 버튼으로 이미지를 추가하세요.</div>';return;}
  container.innerHTML=imgs.map((src,i)=>`<div class="guide-img-thumb"><img src="${src}" onclick="viewImg('${src}')" alt="안내 이미지"><button class="guide-img-del" onclick="deleteGuideImg(${idx},${i})">✕</button></div>`).join('');
}
function loadGuideImgs(){TOOLS.forEach((_,i)=>renderGuideImgs(i));}
function deleteGuideImg(idx,imgIdx){const key=`qa-guide-imgs-${idx}`;const imgs=JSON.parse(localStorage.getItem(key)||'[]');imgs.splice(imgIdx,1);localStorage.setItem(key,JSON.stringify(imgs));renderGuideImgs(idx);}
function viewImg(src){const w=window.open('','_blank');w.document.write(`<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${src}" style="max-width:100%;max-height:100vh"></body></html>`);}
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelector(`.ni[data-v="${v}"]`).classList.add('active');
  if(v==='recent')renderRecent();
  if(v==='all')renderAll();
  if(v==='schedule')renderCalendar();
  if(v==='team')renderTeamCalendar();
  if(v==='guide')renderGuide();
}
function openProfileModal(){document.getElementById('p-name').value=userProfile?userProfile.name:'';document.getElementById('modal-avatar').textContent=userProfile?userProfile.name.charAt(0):'?';document.getElementById('profile-modal').classList.add('open');}
function closeProfileModal(){document.getElementById('profile-modal').classList.remove('open');}
function saveProfile(){
  const name=document.getElementById('p-name').value.trim();
  if(!name){alert('이름을 입력하세요.');return;}
  userProfile={name};
  localStorage.setItem('qa-user-profile',JSON.stringify(userProfile));
  closeProfileModal();updateProfileUI();renderHome();renderCalendar();if(selectedDate)renderSchedList(selectedDate);updateSchedBadge();
}
document.querySelectorAll('.modal-overlay').forEach(el=>{el.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});});
init();
</script>
</body>
</html>
